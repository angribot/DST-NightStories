id: comment-format
language: lua
severity: warning
message: 'Comment only on behavior forced by code we cannot change, as "-- <Source> <path>:<symbol> (<version>): <fact>".'
rule:
  kind: comment
  not:
    any:
      - regex: '^---@'
      - regex: '^-- (Vanilla|Glassic API|DST Fixed|Island Adventures) [\w./-]+\.lua:[\w.:]+ \([\w.]+\): \S'
